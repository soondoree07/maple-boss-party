<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17171C" media="(prefers-color-scheme: dark)">
  <title>메이플 보스 기록</title>

  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/v2.css">
  <link rel="stylesheet" href="css/theme.css">
  <script>
    // 고른 모드(js/theme.js 와 같은 키)를 첫 페인트 전에 적용해 깜빡임을 막는다.
    try {
      var saved = localStorage.getItem('maple-theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
