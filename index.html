<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" id="theme-color-meta" content="#F2F4F6">
  <title>메이플 보스 기록</title>

  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/v2.css">
  <link rel="stylesheet" href="css/user.css">
  <link rel="stylesheet" href="css/theme.css">
  <script>
    // 첫 페인트 전에 모드를 정해 깜빡임을 막는다(js/theme.js 와 같은 키·같은 규칙).
    // 고른 적이 없으면 기기 설정을 따른다. 다크 색은 css/theme.css 의 [data-theme="dark"] 한 곳에만 있다.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('maple-theme'); } catch (e) {}
      var dark = saved ? saved === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.getElementById('theme-color-meta').content = dark ? '#17171C' : '#F2F4F6';
    })();
  </script>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <!-- 넥슨 오픈 API 이용 조건: 서비스에 출처 문구를 반드시 표기한다. 모든 화면 맨 아래 공통. -->
  <footer class="site-credit">Data based on NEXON Open API</footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
